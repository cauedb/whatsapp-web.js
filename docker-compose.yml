services:
    whatsapp-bot:
        build: .
        container_name: whatsapp-web-js
        restart: unless-stopped
        init: true
        env_file:
            - .env
        environment:
            WWEBJS_DATA_PATH: /home/pptruser/app/.wwebjs_auth
        volumes:
            - wwebjs_auth:/home/pptruser/app/.wwebjs_auth
            # Run your own bot instead of the bundled docker/bot.js:
            # - ./my-bot.js:/home/pptruser/app/docker/bot.js:ro
        # Uncomment and match API_PORT in .env to expose the HTTP API (see
        # docker/README.md#http-api). Binding to 127.0.0.1 keeps it host-only;
        # drop that prefix only if you intend to expose it more broadly and
        # have a reverse proxy / TLS / firewall plan for it.
        # ports:
        #     - '127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}'

    # Optional CDP browser backend (https://github.com/h4ckf0r0day/obscura),
    # used instead of the bundled Chrome. Experimental — see docs/docker.md#obscura
    # before pointing a real account at it. Start both with:
    #   docker compose --profile obscura up
    obscura:
        image: h4ckf0r0day/obscura
        container_name: obscura
        restart: unless-stopped
        command: ['serve', '--port', '9222']
        profiles: ['obscura']

volumes:
    wwebjs_auth:
